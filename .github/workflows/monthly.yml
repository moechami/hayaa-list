name: Monthly release

# Attempts a release of the Hayaa List every month, in three separate jobs:
#
#   build    compares against the previous release (the latest GitHub release,
#            every signature checked), re-pins every source that is not
#            frozen, runs every test and gate, builds twice to check the
#            bytes, and uploads the unsigned release files. It never sees the
#            signing key.
#   sign     in the protected `release` environment, from main only: runs
#            OpenSSL and nothing else. No checkout, no npm, no GitHub token
#            (`permissions: {}`); the key goes from the environment straight
#            to OpenSSL and never touches the disk.
#   publish  without the key: checks the serial (gh and jq only: no npm
#            code runs in a step that holds the token), verifies every
#            signature with OpenSSL and with the Node verifier (every check
#            the app runs), and creates the GitHub release.
#
# Nothing is committed to the repository: each release carries the
# sources.lock.json it was built from (signed), and the next build reads it
# from there. The weekly staleness workflow keeps the schedules enabled.
#
# Fail-safe: a new, unreviewed popular entry is held back and the release
# still ships; a source that disappeared, changed its licence or is no longer
# the pinned repository keeps its previous pin; an issue lists everything
# that needs a person. Nothing is published when a gate fails (more than 25
# new held-back entries, a list that shrank or grew too much, and so on); an
# issue says so.

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:
    inputs:
      run:
        description: 'Run number of the day (the NN in the serial YYYYMMDDNN), 1 to 99'
        required: false
        default: '1'
      allow_shrink:
        description: 'Skip the shrink gates (only after a reviewed removal of a source); shown in the release notes'
        required: false
        type: boolean
        default: false
      allow_growth:
        description: 'Skip the growth gates (only after checking the growth by hand); shown in the release notes'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: monthly-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      serial: ${{ steps.serial.outputs.serial }}
      review: ${{ steps.review.outputs.count }}
    env:
      HAYAA_LIST_RUN: ${{ inputs.run || '1' }}
      HAYAA_LIST_ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '0' }}
      HAYAA_LIST_ALLOW_GROWTH: ${{ inputs.allow_growth && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install
        run: npm ci --ignore-scripts

      - name: Fetch the previous release and check its signatures (an empty folder when there is none; an API error fails)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run fetch-previous -- --repo "$GITHUB_REPOSITORY" --out previous

      - name: Re-pin every source that is not frozen (a vanished, relicensed or replaced source keeps its previous pin)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p notes
          npm run update-lock -- --fallback-lock previous/sources.lock.json --notes notes/lock.txt

      - name: Type check and tests
        run: |
          npm run typecheck
          npm test

      - name: Build (runs every gate; the previous release must be signed)
        run: npm run build -- --previous previous

      - name: Show the gate overrides in the run summary (as recorded in build-info.json, which is signed)
        run: |
          jq -r '"Serial \(.serial): gate overrides allow_shrink \(.gateOverrides.allowShrink), allow_growth \(.gateOverrides.allowGrowth). Hosts \(.hostCount)."' dist/build-info.json >> "$GITHUB_STEP_SUMMARY"

      - name: Reproducibility (a second build must give identical bytes)
        run: |
          npm run build -- --out dist-repro --previous previous > /dev/null
          serial=$(node -p "require('./dist/manifest.json').serial")
          for f in "hayaa-list-$serial.bin" "hayaa-list-$serial.bin.gz" "hayaa-list-$serial.txt" starter.bin manifest.json build-info.json; do
            cmp "dist/$f" "dist-repro/$f"
          done
          sha256sum dist/*

      - id: serial
        name: Read the serial
        run: echo "serial=$(node -p "require('./dist/manifest.json').serial")" >> "$GITHUB_OUTPUT"

      - name: The serial must be newer than every release (no release yet passes; an API error fails)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERIAL: ${{ steps.serial.outputs.serial }}
        run: npm run check-serial -- --repo "$GITHUB_REPOSITORY" --serial "$SERIAL"

      - id: review
        name: Collect what needs a person (upstream text is sanitised into notes/issue-body.md)
        run: |
          cp dist/held-back.txt notes/held-back.txt
          count=$(npx --no-install tsx scripts/issue-body.ts --notes notes --out notes/issue-body.md --build-info dist/build-info.json)
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Stage the release files (unsigned; the sign job adds the signatures)
        env:
          SERIAL: ${{ steps.serial.outputs.serial }}
        run: |
          mkdir release
          cp "dist/hayaa-list-$SERIAL.bin.gz" "dist/hayaa-list-$SERIAL.txt" dist/starter.bin dist/manifest.json dist/build-info.json release/
          cp sources.lock.json LICENSE CREDITS.md release/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes/
          if-no-files-found: error
          retention-days: 30

      - name: Keep the failure report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-failure
          path: |
            dist/
            notes/
            sources.lock.json
          if-no-files-found: ignore
          retention-days: 30

  sign:
    needs: build
    # Only ever from main, and only through the protected environment (see
    # keys/README.md: deployments limited to main, a required reviewer who is
    # not the person who started the run, the key as an environment secret).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Sign with OpenSSL (the key goes from the environment straight to OpenSSL, never to disk)
        shell: bash
        env:
          LIST_SIGNING_KEY: ${{ secrets.LIST_SIGNING_KEY }}
        run: |
          set +x
          if [ -z "$LIST_SIGNING_KEY" ]; then echo "LIST_SIGNING_KEY is not set in the release environment"; exit 1; fi
          mkdir signatures
          for f in manifest.json build-info.json sources.lock.json; do
            openssl dgst -sha256 -sign <(printf '%s\n' "$LIST_SIGNING_KEY") -out "signatures/$f.sig" "release/$f"
          done
          unset LIST_SIGNING_KEY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signatures
          path: signatures/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [build, sign]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SERIAL: ${{ needs.build.outputs.serial }}
      INPUT_SHRINK: ${{ inputs.allow_shrink && 'true' || 'false' }}
      INPUT_GROWTH: ${{ inputs.allow_growth && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signatures
          path: signatures

      - name: The files are the ones the build made (manifest serial == build serial)
        run: |
          cp signatures/*.sig release/
          test "$(node -p "require('./release/manifest.json').serial")" = "$SERIAL"
          test "$(node -p "require('./release/build-info.json').serial")" = "$SERIAL"
          test -f "release/hayaa-list-$SERIAL.bin.gz"
          test -f "release/hayaa-list-$SERIAL.txt"
          test "$(jq -r .gateOverrides.allowShrink release/build-info.json)" = "$INPUT_SHRINK"
          test "$(jq -r .gateOverrides.allowGrowth release/build-info.json)" = "$INPUT_GROWTH"

      # gh and jq only: no npm, npx, tsx or node code runs in a step that holds this token.
      - name: The serial must still be newer than every release (no release yet passes; an API error fails)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$SERIAL" =~ ^[0-9]{10}$ ]] || (( 10#$SERIAL > 4294967295 )); then echo "bad serial $SERIAL"; exit 1; fi
          # Every release, drafts included; any API error fails the step.
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          newest=0
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v([0-9]{10})$ ]] && (( 10#${BASH_REMATCH[1]} > newest )); then newest=$(( 10#${BASH_REMATCH[1]} )); fi
          done <<< "$tags"
          if (( 10#$SERIAL <= newest )); then echo "serial $SERIAL is not newer than the latest release v$newest"; exit 1; fi
          echo "serial $SERIAL is newer than every release (newest so far: $newest)"

      - name: Verify every signature with OpenSSL
        run: |
          key_id=$(node -p "require('./release/manifest.json').keyId")
          for f in manifest.json build-info.json sources.lock.json; do
            openssl dgst -sha256 -verify "keys/$key_id.pub.pem" -signature "release/$f.sig" "release/$f"
          done

      - name: Verify every check the app runs (Node verifier)
        run: npm run verify -- --dir release --release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Read with jq from the signed build-info.json: this step holds the token.
          held=$(jq '.heldBack.topSites + .heldBack.topSiteSubdomains + .heldBackEduGov | length' release/build-info.json)
          ALLOW_SHRINK=$(jq -r 'if .gateOverrides.allowShrink then "yes" else "no" end' release/build-info.json)
          ALLOW_GROWTH=$(jq -r 'if .gateOverrides.allowGrowth then "yes" else "no" end' release/build-info.json)
          gh release create "v$SERIAL" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Hayaa List $SERIAL" \
            --notes "Monthly build. Built from the sources.lock.json attached here. The list data is licensed under the GNU GPL version 3 only (LICENSE); sources and attributions are in CREDITS.md, file formats in docs/FORMAT.md. Entries held back for review: $held (see build-info.json). Gate overrides used for this release: allow_shrink $ALLOW_SHRINK, allow_growth $ALLOW_GROWTH." \
            --latest \
            "release/hayaa-list-$SERIAL.bin.gz" \
            "release/hayaa-list-$SERIAL.txt" \
            release/starter.bin \
            release/manifest.json \
            release/manifest.json.sig \
            release/build-info.json \
            release/build-info.json.sig \
            release/sources.lock.json \
            release/sources.lock.json.sig \
            release/LICENSE \
            release/CREDITS.md

  report-review:
    needs: [build, sign, publish]
    # Runs even when signing or publishing failed: what needs a person still needs one.
    # From main only: a run dispatched on another branch never opens an issue.
    if: always() && github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.build.outputs.review != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes

      - name: Open an issue listing what needs review
        env:
          GH_TOKEN: ${{ github.token }}
          SERIAL: ${{ needs.build.outputs.serial }}
          PUBLISHED: ${{ needs.publish.result }}
        run: |
          if [ "$PUBLISHED" = "success" ]; then status="was published"; else status="was built but NOT published (publish: $PUBLISHED)"; fi
          {
            echo "Release v$SERIAL $status. These items need a person:"
            echo
            cat notes/issue-body.md
          } > body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Release v$SERIAL: items to review" --body-file body.md

  report-failure:
    needs: [build, sign, publish]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Monthly release failed ($(date -u +%Y-%m-%d))" \
            --body "The monthly build, signing or release failed. Unless the log shows the publish job finished, nothing was published. Run: $RUN_URL

          If more than 25 new popular entries appeared, the build-failure artifact holds held-back-candidates.txt: review each into data/reviewed-top-hits.txt, data/reviewed-top-site-subdomains.txt, data/pending-review.txt or data/allowlist.txt, then run the workflow again by hand. If a shrink or growth gate failed, find out why before re-running with allow_shrink or allow_growth."
